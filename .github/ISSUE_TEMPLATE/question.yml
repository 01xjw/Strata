name: Question
description: Ask how to use Strata, or share a result
title: "Question: "
labels: ["question"]
body:
  - type: markdown
    value: |
      Not sure how to do something, or want to share numbers from your machine? Ask here. To share a full benchmark, see [CONTRIBUTING.md](https://github.com/Niko1221/Strata/blob/main/CONTRIBUTING.md#share-a-benchmark).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do. Include your version, GPU, and OS if it affects the answer.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: What you already did and where you got stuck.
    validations:
      required: false
  - type: textarea
    id: numbers
    attributes:
      label: Results (optional)
      description: Only if you ran a benchmark or measured speed. Model, quant, context, and the tok/s you get.
    validations:
      required: false
